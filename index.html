<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedmasseberegner</title>
    
    <!-- Henter React og værktøjer direkte fra nettet -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Ikoner -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Fjerner pile fra tal-input i nogle browsere for et renere look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 selection:bg-green-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- IKONER ---
        const TreePine = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.9-1.5l2.9-4H8.7a1 1 0 0 1-.9-1.5l2.9-4c.5-.7 1.6-.7 2.1 0l2.9 4a1 1 0 0 1-.9 1.5H15l2.9 4a1 1 0 0 1-.9 1.5H17Z"/><path d="M12 22v-3"/></svg>;
        const Calculator = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const CircleDashed = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.1 2.18a9.93 9.93 0 0 1 3.8 0"/><path d="M17.6 3.71a9.95 9.95 0 0 1 2.69 2.7"/><path d="M21.82 10.1a9.93 9.93 0 0 1 0 3.8"/><path d="M20.29 17.6a9.95 9.95 0 0 1-2.7 2.69"/><path d="M13.9 21.82a9.94 9.94 0 0 1-3.8 0"/><path d="M6.4 20.29a9.95 9.95 0 0 1-2.69-2.7"/><path d="M2.18 13.9a9.93 9.93 0 0 1 0-3.8"/><path d="M3.71 6.4a9.95 9.95 0 0 1 2.7-2.69"/></svg>;
        const ListTree = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M12 19c0-4.2-2.7-7.6-6-8.5"/><path d="M12 19V5"/><path d="M6 19v-4.5"/><path d="M9 19v-2.5"/></svg>;
        const Activity = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
        const Plus = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const Trash2 = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;

        // --- DATA ---
        const FORMTAL_GRIDS = {
            'Ask': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.6487, 0.5968, 0.5632, 0.5492, 0.5406], [0.6840, 0.6209, 0.5938, 0.5791, 0.5701], [0.7120, 0.6463, 0.6181, 0.6028, 0.5933], [0.7318, 0.6643, 0.6353, 0.6196, 0.6099], [0.7429, 0.6744, 0.6449, 0.6289, 0.6191]] },
            'Bøg': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.6859, 0.6111, 0.5631, 0.5284, 0.5017], [0.7273, 0.6480, 0.5970, 0.5603, 0.5320], [0.7745, 0.6901, 0.6358, 0.5967, 0.5665], [0.8203, 0.7309, 0.6734, 0.6320, 0.6000], [0.8640, 0.7698, 0.7093, 0.6657, 0.6320]] },
            'Douglasgran': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5540, 0.5520, 0.5506, 0.5496, 0.5487], [0.4972, 0.4954, 0.4942, 0.4933, 0.4925], [0.4707, 0.4691, 0.4679, 0.4670, 0.4662], [0.4569, 0.4553, 0.4541, 0.4533, 0.4525], [0.4506, 0.4490, 0.4479, 0.4470, 0.4463]] },
            'Eg': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.6701, 0.5867, 0.5404, 0.5093, 0.4865], [0.7307, 0.6398, 0.5893, 0.5554, 0.5305], [0.7777, 0.6809, 0.6271, 0.5911, 0.5646], [0.8195, 0.7175, 0.6609, 0.6229, 0.5949], [0.8588, 0.7520, 0.6926, 0.6528, 0.6235]] },
            'Japansk Lærk': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5653, 0.6158, 0.6598, 0.6984, 0.7329], [0.4796, 0.5224, 0.5597, 0.5925, 0.6218], [0.4316, 0.4701, 0.5038, 0.5333, 0.5596], [0.3967, 0.4321, 0.4630, 0.4901, 0.5143], [0.3678, 0.4006, 0.4293, 0.4544, 0.4769]] },
            'Kæmpegran': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5094, 0.5340, 0.5521, 0.5666, 0.5788], [0.4564, 0.4784, 0.4947, 0.5077, 0.5186], [0.4341, 0.4551, 0.4706, 0.4829, 0.4933], [0.4202, 0.4405, 0.4555, 0.4674, 0.4774], [0.4084, 0.4281, 0.4427, 0.4543, 0.4640]] },
            'Nobilis': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5779, 0.6249, 0.6727, 0.7173, 0.7586], [0.5035, 0.5445, 0.5861, 0.6250, 0.6610], [0.4645, 0.5024, 0.5407, 0.5766, 0.6098], [0.4387, 0.4745, 0.5107, 0.5446, 0.5759], [0.4197, 0.4539, 0.4886, 0.5210, 0.5510]] },
            'Rødgran': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5801, 0.5978, 0.6142, 0.6286, 0.6414], [0.5166, 0.5323, 0.5470, 0.5598, 0.5712], [0.4800, 0.4946, 0.5082, 0.5202, 0.5308], [0.4479, 0.4615, 0.4742, 0.4854, 0.4952], [0.4147, 0.4274, 0.4391, 0.4494, 0.4586]] },
            'Sitkagran': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5407, 0.5892, 0.6397, 0.6876, 0.7324], [0.4582, 0.4994, 0.5422, 0.5828, 0.6207], [0.4095, 0.4462, 0.4845, 0.5207, 0.5547], [0.3703, 0.4036, 0.4381, 0.4709, 0.5016], [0.3347, 0.3647, 0.3960, 0.4256, 0.4533]] },
            'Thuja': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.4958, 0.6283, 0.7433, 0.8468, 0.9420], [0.3454, 0.4378, 0.5179, 0.5900, 0.6563], [0.2703, 0.3426, 0.4053, 0.4617, 0.5137], [0.2272, 0.2879, 0.3406, 0.3880, 0.4317], [0.1985, 0.2516, 0.2976, 0.3391, 0.3772]] },
            'Ædelgran': { diametre: [10, 20, 30, 40, 50], hoejder: [10, 15, 20, 25, 30], data: [[0.5752, 0.5644, 0.5834, 0.6097, 0.6380], [0.5381, 0.5279, 0.5457, 0.5704, 0.5968], [0.5080, 0.4984, 0.5152, 0.5384, 0.5634], [0.4669, 0.4581, 0.4736, 0.4950, 0.5179], [0.4133, 0.4055, 0.4192, 0.4381, 0.4584]] },
        };

        const TRAEARTER = [
            { navn: 'Ask', standardFormtal: 0.59 },
            { navn: 'Bøg', standardFormtal: 0.58 }, 
            { navn: 'Douglasgran', standardFormtal: 0.50 },
            { navn: 'Eg', standardFormtal: 0.62 },
            { navn: 'Japansk Lærk', standardFormtal: 0.46 }, 
            { navn: 'Kæmpegran', standardFormtal: 0.48 },
            { navn: 'Nobilis', standardFormtal: 0.50 },
            { navn: 'Rødgran', standardFormtal: 0.52 }, 
            { navn: 'Sitkagran', standardFormtal: 0.48 },
            { navn: 'Thuja', standardFormtal: 0.50 }, 
            { navn: 'Ædelgran', standardFormtal: 0.54 }, 
        ];

        function SkovBeregner() {
            // --- Input State ---
            const [radius, setRadius] = useState(""); 
            const [areal, setAreal] = useState(""); 
            const [valgtTræIndeks, setValgtTræIndeks] = useState(7); // Default til 7 = Rødgran

            // Træ-liste state (Tom fra start)
            const [trees, setTrees] = useState([]);
            
            // State til indtastningsfeltet
            const [nyDiameter, setNyDiameter] = useState("");
            const [nyHoejde, setNyHoejde] = useState(""); 
            
            const dInputRef = useRef(null); 

            // --- Interpolation: Udregner det præcise formtal ud fra D og H ---
            const beregnFormtalFraGrid = (d, h, gridData) => {
                const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
                const minD = gridData.diametre[0];
                const maxD = gridData.diametre[gridData.diametre.length - 1];
                const minH = gridData.hoejder[0];
                const maxH = gridData.hoejder[gridData.hoejder.length - 1];

                const d_safe = clamp(d, minD, maxD);
                const h_safe = clamp(h, minH, maxH);

                let i = 0; while (i < gridData.diametre.length - 2 && d_safe > gridData.diametre[i+1]) i++;
                let j = 0; while (j < gridData.hoejder.length - 2 && h_safe > gridData.hoejder[j+1]) j++;

                const x1 = gridData.diametre[i], x2 = gridData.diametre[i+1];
                const y1 = gridData.hoejder[j], y2 = gridData.hoejder[j+1];
                const Q11 = gridData.data[i][j], Q12 = gridData.data[i][j+1];
                const Q21 = gridData.data[i+1][j], Q22 = gridData.data[i+1][j+1];

                const x_factor = (d_safe - x1) / (x2 - x1);
                const y_factor = (h_safe - y1) / (y2 - y1);

                const R1 = Q11 + x_factor * (Q21 - Q11);
                const R2 = Q12 + x_factor * (Q22 - Q12);
                return R1 + y_factor * (R2 - R1);
            };

            // Tilføj træ funktion
            const tilfoejTrae = (e) => {
                e.preventDefault();
                if (nyDiameter > 0 && nyHoejde > 0) {
                    setTrees([...trees, { 
                        id: Date.now(), 
                        d: parseFloat(nyDiameter), 
                        h: parseFloat(nyHoejde) 
                    }]);
                    setNyDiameter(""); 
                    dInputRef.current?.focus(); 
                }
            };

            const sletTrae = (id) => {
                setTrees(trees.filter(t => t.id !== id));
            };

            // --- Hovedberegning (Opdateret til individuel formtalsberegning) ---
            const [resultater, setResultater] = useState({
                stamtalPrHa: 0,
                G_ha: 0,
                Dg: 0,
                HD_forhold: 0,
                volumenHa: 0,
                volumenTotal: 0,
                gnsFormtal: 0,
                loreysH: 0,
                v_g: 0
            });

            useEffect(() => {
                const N_plot = trees.length;
                const radNum = parseFloat(radius);
                const arealNum = parseFloat(areal) || 0;
                
                if (N_plot === 0 || !radNum || radNum <= 0) {
                    setResultater({ stamtalPrHa: 0, G_ha: 0, Dg: 0, HD_forhold: 0, volumenHa: 0, volumenTotal: 0, gnsFormtal: 0, loreysH: 0, v_g: 0 });
                    return;
                }

                const prøveArealM2 = Math.PI * Math.pow(radNum, 2);
                const opgangningsFaktor = 10000 / prøveArealM2;
                const stamtalPrHa = N_plot * opgangningsFaktor;

                const valgtArt = TRAEARTER[valgtTræIndeks];
                const gridData = FORMTAL_GRIDS[valgtArt.navn];

                let g_sum = 0;
                let v_sum = 0;
                let hd_sum = 0;
                let gh_sum = 0;

                // Løb igennem HVERT træ
                trees.forEach(tree => {
                    // 1. Grundflade (m2)
                    const radiusM = (tree.d / 100) / 2;
                    const g_i = Math.PI * Math.pow(radiusM, 2);
                    
                    // 2. Find det PRÆCISE formtal til dette specifikke træ
                    let f_i = valgtArt.standardFormtal;
                    if (gridData) {
                        f_i = beregnFormtalFraGrid(tree.d, tree.h, gridData);
                    }

                    // 3. Beregn volumen
                    const v_i = g_i * tree.h * f_i;

                    // 4. H/D forhold
                    const hd_i = (tree.h * 100) / tree.d;

                    g_sum += g_i;
                    v_sum += v_i;
                    hd_sum += hd_i;
                    gh_sum += (g_i * tree.h);
                });

                // Skaler op til Hektar
                const G_ha = g_sum * opgangningsFaktor;
                const V_ha = v_sum * opgangningsFaktor;
                const V_total = V_ha * arealNum;

                // Beregn Dg (Grundflademiddeldiameter)
                const g_mean = g_sum / N_plot; 
                const Dg_meter = Math.sqrt(g_mean / Math.PI) * 2; 
                const Dg = Dg_meter * 100; 

                const HD_mean = hd_sum / N_plot;

                // Beregn Loreys Middelhøjde (vægtet med grundflade)
                const loreysH = g_sum > 0 ? gh_sum / g_sum : 0;
                
                // Beregn Middelstammens volumen (gennemsnitligt volumen pr. træ)
                const v_g = v_sum / N_plot;

                // Beregn et gennemsnitligt "synligt" formtal for brugerens skyld (Volumen divideret med Cylinder)
                const h_mean = trees.reduce((acc, t) => acc + t.h, 0) / N_plot;
                const gnsFormtal = v_sum / (g_sum * h_mean);

                setResultater({
                    stamtalPrHa,
                    G_ha,
                    Dg,
                    HD_forhold: HD_mean,
                    volumenHa: V_ha,
                    volumenTotal: V_total,
                    gnsFormtal: gnsFormtal || 0,
                    loreysH,
                    v_g
                });
            }, [trees, radius, valgtTræIndeks, areal]);

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center">
                    <div className="w-full max-w-4xl bg-white rounded-xl shadow-xl overflow-hidden border border-stone-200">
                        {/* Header */}
                        <div className="bg-green-800 p-6 text-white flex items-center justify-between">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-2">
                                    <TreePine className="w-8 h-8" />
                                    Vedmasseberegner
                                </h1>
                                <p className="text-green-100 text-sm mt-1">Prøvefladetaksation</p>
                            </div>
                            <Calculator className="w-8 h-8 opacity-50 hidden sm:block" />
                        </div>

                        <div className="p-6 grid lg:grid-cols-2 gap-8">
                            
                            {/* VENSTRE KOLONNE: Indstillinger & Indtastning */}
                            <div className="space-y-8">
                                
                                {/* Sektion 1: Område */}
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold border-b pb-2 border-stone-200 flex items-center gap-2 text-green-900">
                                        <CircleDashed className="w-5 h-5" />
                                        Område & Bestand
                                    </h2>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="flex flex-col col-span-2 sm:col-span-1">
                                            <label className="text-xs font-bold uppercase text-green-800 mb-1">Prøveflade Radius (m)</label>
                                            <input type="number" step="0.1" value={radius} onChange={(e) => setRadius(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none" placeholder="F.eks. 15" />
                                        </div>
                                        <div className="flex flex-col col-span-2 sm:col-span-1">
                                            <label className="text-xs font-bold uppercase text-green-800 mb-1">Totalt Areal (ha)</label>
                                            <input type="number" step="0.1" value={areal} onChange={(e) => setAreal(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none" placeholder="F.eks. 1.5" />
                                        </div>
                                        <div className="flex flex-col col-span-2">
                                            <label className="text-xs font-medium text-stone-600 mb-1">Træart</label>
                                            <select value={valgtTræIndeks} onChange={(e) => setValgtTræIndeks(Number(e.target.value))} className="p-2 border border-stone-300 rounded bg-stone-50 focus:ring-2 focus:ring-green-500 outline-none">
                                                {TRAEARTER.map((træ, idx) => <option key={idx} value={idx}>{træ.navn}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {/* Sektion 2: Træliste */}
                                <div className="space-y-4">
                                    <div className="flex justify-between items-end border-b pb-2 border-stone-200">
                                        <h2 className="text-lg font-semibold flex items-center gap-2 text-stone-800">
                                            <ListTree className="w-5 h-5 text-green-700" />
                                            Målte Træer ({trees.length})
                                        </h2>
                                    </div>

                                    {/* Hurtig indtastning */}
                                    <form onSubmit={tilfoejTrae} className="flex gap-2 items-end bg-green-50 p-3 rounded-lg border border-green-200 shadow-sm">
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-green-900 mb-1 block">Diameter (cm)</label>
                                            <input 
                                                ref={dInputRef}
                                                type="number" 
                                                step="0.1"
                                                value={nyDiameter} 
                                                onChange={(e) => setNyDiameter(e.target.value)} 
                                                placeholder="D"
                                                className="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 outline-none"
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-xs font-bold text-green-900 mb-1 block">Højde (m)</label>
                                            <input 
                                                type="number" 
                                                step="0.1"
                                                value={nyHoejde} 
                                                onChange={(e) => setNyHoejde(e.target.value)} 
                                                placeholder="H"
                                                className="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 outline-none"
                                            />
                                        </div>
                                        <button type="submit" disabled={!nyDiameter || !nyHoejde} className="bg-green-700 text-white p-2 rounded hover:bg-green-800 disabled:opacity-50 transition-colors h-[42px] px-4 flex items-center gap-1">
                                            <Plus className="w-4 h-4" /> <span className="hidden sm:inline">Tilføj</span>
                                        </button>
                                    </form>

                                    {/* Listen med træer */}
                                    <div className="bg-stone-50 border rounded-lg max-h-64 overflow-y-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-stone-200 sticky top-0">
                                                <tr>
                                                    <th className="p-2 font-medium text-stone-600">#</th>
                                                    <th className="p-2 font-medium text-stone-600">Diameter</th>
                                                    <th className="p-2 font-medium text-stone-600">Højde</th>
                                                    <th className="p-2 font-medium text-stone-600 text-right">Slet</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {trees.length === 0 ? (
                                                    <tr><td colSpan="4" className="text-center p-4 text-stone-400 italic">Begynd at taste træer ovenfor for at starte.</td></tr>
                                                ) : (
                                                    trees.reverse().map((t, index) => (
                                                        <tr key={t.id} className="border-b border-stone-100 last:border-0 hover:bg-white">
                                                            <td className="p-2 text-stone-400">{trees.length - index}</td>
                                                            <td className="p-2 font-semibold">{t.d} cm</td>
                                                            <td className="p-2 text-stone-600">{t.h} m</td>
                                                            <td className="p-2 text-right">
                                                                <button onClick={() => sletTrae(t.id)} className="text-red-400 hover:text-red-600 p-1 rounded inline-flex justify-center w-full">
                                                                    <Trash2 className="w-4 h-4" />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>

                                </div>
                            </div>

                            {/* HØJRE KOLONNE: Resultater */}
                            <div className="bg-stone-800 text-stone-100 rounded-xl p-6 shadow-xl h-fit sticky top-8 border border-stone-600">
                                <h2 className="text-xl font-bold mb-6 flex items-center gap-2 text-green-400 border-b border-stone-600 pb-3">
                                    <Activity className="w-6 h-6" />
                                    Bestandsdata & Vedmasse
                                </h2>
                                
                                <div className="space-y-6">
                                    
                                    {/* Nøgletal Grid */}
                                    <div className="grid grid-cols-2 gap-4 bg-stone-700/50 p-4 rounded-lg">
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1">Grundflade.Mid.Dia (Dg)</p>
                                            <p className="text-2xl font-bold text-white">{resultater.Dg.toFixed(1)} <span className="text-sm font-normal text-stone-400">cm</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1" title="Loreys Middelhøjde">Loreys Højde (HL)</p>
                                            <p className="text-2xl font-bold text-white">{resultater.loreysH.toFixed(1)} <span className="text-sm font-normal text-stone-400">m</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1">Grundflade (G)</p>
                                            <p className="text-2xl font-bold text-white">{resultater.G_ha.toFixed(1)} <span className="text-sm font-normal text-stone-400">m²/ha</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1">Stamtal (N)</p>
                                            <p className="text-2xl font-bold text-white">{Math.round(resultater.stamtalPrHa)} <span className="text-sm font-normal text-stone-400">stk/ha</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1" title="Middelstammens volumen">Middeltræ (Vg)</p>
                                            <p className="text-2xl font-bold text-white">{resultater.v_g.toFixed(1)} <span className="text-sm font-normal text-stone-400">m³</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase tracking-wider mb-1" title="Højde/Diameter Forhold">H/D Forhold</p>
                                            <p className={`text-2xl font-bold ${resultater.HD_forhold > 80 ? 'text-orange-400' : 'text-green-300'}`}>
                                                {resultater.HD_forhold.toFixed(1)}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Formtal info */}
                                    <div className="flex justify-between items-center text-sm bg-stone-900/50 p-3 rounded">
                                        <span className="text-stone-400">
                                            Gns. formtal:
                                        </span>
                                        <span className="font-mono text-yellow-400">{resultater.gnsFormtal.toFixed(3)}</span>
                                    </div>

                                    <div className="h-px bg-stone-600 w-full"></div>

                                    {/* Hovedresultater */}
                                    <div className="flex flex-col gap-4">
                                        <div className="text-center">
                                            <p className="text-stone-400 text-sm uppercase tracking-widest mb-1">Volumen pr. Hektar</p>
                                            <p className="text-4xl font-black text-white">{resultater.volumenHa.toFixed(1)} m³</p>
                                        </div>
                                        
                                        <div className="text-center bg-green-900/40 border border-green-800/50 p-4 rounded-xl mt-2">
                                            <p className="text-green-300/80 text-xs uppercase tracking-widest mb-1">Total Volumen for {areal || 0} ha</p>
                                            <p className="text-5xl font-black text-green-400 drop-shadow-md">{resultater.volumenTotal.toFixed(1)} m³</p>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SkovBeregner />);
    </script>
</body>
</html>
