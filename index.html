        };

        const TRAEARTER = [
            { navn: 'Ask', standardFormtal: 0.59 },
            { navn: 'Bøg', standardFormtal: 0.58 }, 
            { navn: 'Douglasgran', standardFormtal: 0.50 },
            { navn: 'Eg', standardFormtal: 0.62 },
            { navn: 'Japansk Lærk', standardFormtal: 0.46 }, 
            { navn: 'Kæmpegran', standardFormtal: 0.48 },

            { navn: 'Ædelgran', standardFormtal: 0.54 },

        // --- Hjælpefunktion til dansk talformatering ---
        const formatDK = (num, decimals = null) => {
            if (num === null || num === undefined || num === '') return '';
            const n = Number(num);
            if (isNaN(n)) return (0).toFixed(decimals !== null ? decimals : 0).replace('.', ',');
            return (decimals !== null ? n.toFixed(decimals) : n.toString()).replace('.', ',');
        };

        function SkovBeregner() {
            const getSavedState = (key, defaultValue) => {
                try {
                    const saved = localStorage.getItem(key);
                    return saved !== null ? JSON.parse(saved) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            };

            // --- Input State ---
            const [radius, setRadius] = useState(() => getSavedState('skov_radius', "")); 
            const [areal, setAreal] = useState(() => getSavedState('skov_areal', "")); 
            const [valgtTræIndeks, setValgtTræIndeks] = useState(() => getSavedState('skov_art', 7));
            
            // Ny state til at holde styr på hvor mange prøveflader der er smeltet sammen
            const [antalFlader, setAntalFlader] = useState(() => getSavedState('skov_antal_flader', 1));

            // Træ-liste state
            const [trees, setTrees] = useState(() => getSavedState('skov_trees', []));
            const [savedPlots, setSavedPlots] = useState(() => getSavedState('skov_saved_plots', []));
            
            // Stamdata / Metadata 
            const [saveSkov, setSaveSkov] = useState(() => getSavedState('skov_ejendom', ""));
            const [saveAfdeling, setSaveAfdeling] = useState(() => getSavedState('skov_afd', ""));
            const [saveLitra, setSaveLitra] = useState(() => getSavedState('skov_litra', ""));
            const [saveAarstal, setSaveAarstal] = useState(() => getSavedState('skov_aarstal', ""));
            const [saveCustomName, setSaveCustomName] = useState("");

            // Inputfelter til måling
            const [nyDiameter1, setNyDiameter1] = useState("");
            const [nyDiameter2, setNyDiameter2] = useState(""); 
            const [nyHoejde, setNyHoejde] = useState(""); 
            
            // UI States
            const [kopieret, setKopieret] = useState(false);
            const [visRydBekræft, setVisRydBekræft] = useState(false);
            const [isSaveModalOpen, setIsSaveModalOpen] = useState(false);
            const [isLoadModalOpen, setIsLoadModalOpen] = useState(false);
            const [saveMode, setSaveMode] = useState('structured'); 
            const [mergeMode, setMergeMode] = useState(false);
            const [selectedForMerge, setSelectedForMerge] = useState([]);

            const dInputRef = useRef(null); 

            // --- Gem alt i lokal hukommelse kontinuerligt ---
            useEffect(() => {
                try {
                    localStorage.setItem('skov_radius', JSON.stringify(radius));
                    localStorage.setItem('skov_areal', JSON.stringify(areal));
                    localStorage.setItem('skov_art', JSON.stringify(valgtTræIndeks));
                    localStorage.setItem('skov_trees', JSON.stringify(trees));
                    localStorage.setItem('skov_saved_plots', JSON.stringify(savedPlots));
                    localStorage.setItem('skov_ejendom', JSON.stringify(saveSkov));
                    localStorage.setItem('skov_afd', JSON.stringify(saveAfdeling));
                    localStorage.setItem('skov_litra', JSON.stringify(saveLitra));
                    localStorage.setItem('skov_aarstal', JSON.stringify(saveAarstal));
                    localStorage.setItem('skov_antal_flader', JSON.stringify(antalFlader));
                } catch (e) {
                    console.warn("Kunne ikke gemme lokalt.");
                }
            }, [radius, areal, valgtTræIndeks, trees, savedPlots, saveSkov, saveAfdeling, saveLitra, saveAarstal, antalFlader]);

            // --- Interpolation af formtal ---
            const beregnFormtalFraGrid = (d, h, gridData) => {
                const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
                const minD = gridData.diametre[0];
                const maxD = gridData.diametre[gridData.diametre.length - 1];
                const minH = gridData.hoejder[0];
                const maxH = gridData.hoejder[gridData.hoejder.length - 1];

                const d_safe = clamp(d, minD, maxD);
                const h_safe = clamp(h, minH, maxH);

                let i = 0; while (i < gridData.diametre.length - 2 && d_safe > gridData.diametre[i+1]) i++;
                let j = 0; while (j < gridData.hoejder.length - 2 && h_safe > gridData.hoejder[j+1]) j++;

                const x1 = gridData.diametre[i], x2 = gridData.diametre[i+1];
                const y1 = gridData.hoejder[j], y2 = gridData.hoejder[j+1];
                const Q11 = gridData.data[i][j], Q12 = gridData.data[i][j+1];
                const Q21 = gridData.data[i+1][j], Q22 = gridData.data[i+1][j+1];

                const x_factor = (d_safe - x1) / (x2 - x1);
                const y_factor = (h_safe - y1) / (y2 - y1);

                const R1 = Q11 + x_factor * (Q21 - Q11);
                const R2 = Q12 + x_factor * (Q22 - Q12);
                return R1 + y_factor * (R2 - R1);
            };

            const tilfoejTrae = (e) => {
                e.preventDefault();
                const pD1 = parseFloat(nyDiameter1.toString().replace(',', '.'));
                const pD2 = parseFloat(nyDiameter2.toString().replace(',', '.'));
                const parsedH = parseFloat(nyHoejde.toString().replace(',', '.'));
                
                let finalD = 0;
                if (!isNaN(pD1) && pD1 > 0 && !isNaN(pD2) && pD2 > 0) {
                    finalD = (pD1 + pD2) / 2;
                } else if (!isNaN(pD1) && pD1 > 0) {
                    finalD = pD1;
                } else if (!isNaN(pD2) && pD2 > 0) {
                    finalD = pD2;
                }
                
                if (finalD > 0 && !isNaN(parsedH) && parsedH > 0) {
                    setTrees([...trees, { 
                        id: Date.now(), 
                        d: finalD, 
                        h: parsedH,
                        artIndeks: valgtTræIndeks
                    }]);
                    setNyDiameter1(""); 
                    setNyDiameter2(""); 
                    dInputRef.current?.focus(); 
                }
            };

            const sletTrae = (id) => {
                setTrees(trees.filter(t => t.id !== id));
            };

            const rydAlt = () => {
                setTrees([]); setRadius(""); setAreal(""); setValgtTræIndeks(7);
                setSaveSkov(""); setSaveAfdeling(""); setSaveLitra(""); setSaveAarstal("");
                setAntalFlader(1);
                setVisRydBekræft(false);
            };

            const handleSavePlot = () => {
                let plotName = "";
                const unikeArter = [...new Set(trees.map(t => TRAEARTER[t.artIndeks !== undefined ? t.artIndeks : valgtTræIndeks].navn))];
                const dynamiskArtNavn = unikeArter.length > 1 ? 'Blandingsskov' : (unikeArter[0] || TRAEARTER[valgtTræIndeks].navn);

                if (saveMode === 'structured') {
                    const parts = [];
                    if (saveAarstal) {
                        const alder = new Date().getFullYear() - parseInt(saveAarstal);
                        if (!isNaN(alder)) parts.push(`${saveAarstal} (${alder} år)`);
                    }
                    if (saveLitra) parts.push(`Litra ${saveLitra}`);
                    if (saveAfdeling) parts.push(`afd. ${saveAfdeling}`);
                    if (saveSkov) parts.push(`${saveSkov}`);
                    
                    plotName = `${dynamiskArtNavn}` + (parts.length > 0 ? `, ${parts.join(', ')}` : '');
                } else {
                    plotName = saveCustomName.trim() || 'Unavngivet prøveflade';
                }

                setSavedPlots([...savedPlots, {
                    id: Date.now(), name: plotName, date: new Date().toLocaleDateString('da-DK'),
                    data: { radius, areal, valgtTræIndeks, trees, saveSkov, saveAfdeling, saveLitra, saveAarstal, antalFlader }
                }]);
                setIsSaveModalOpen(false);
                setSaveCustomName("");
            };

            const loadPlot = (plot) => {
                setRadius(plot.data.radius); setAreal(plot.data.areal);
                setValgtTræIndeks(plot.data.valgtTræIndeks); setTrees(plot.data.trees);
                setAntalFlader(plot.data.antalFlader || 1);
                if(plot.data.saveSkov !== undefined) setSaveSkov(plot.data.saveSkov);
                if(plot.data.saveAfdeling !== undefined) setSaveAfdeling(plot.data.saveAfdeling);
                if(plot.data.saveLitra !== undefined) setSaveLitra(plot.data.saveLitra);
                if(plot.data.saveAarstal !== undefined) setSaveAarstal(plot.data.saveAarstal);
                closeLoadModal();
            };

            const deletePlot = (id) => {
                setSavedPlots(savedPlots.filter(p => p.id !== id));
                setSelectedForMerge(selectedForMerge.filter(sid => sid !== id));
            };

            const toggleMergeSelection = (id) => {
                setSelectedForMerge(selectedForMerge.includes(id) ? selectedForMerge.filter(i => i !== id) : [...selectedForMerge, id]);
            };

            const executeMerge = () => {
                if (selectedForMerge.length < 2) return;
                let totalSampleArea = 0; let combinedTrees = [];
                let firstSkov = "", firstAfd = "", firstLitra = "", firstAar = "", firstAreal = "";
                let totalPlots = 0;

                selectedForMerge.forEach(id => {
                    const plot = savedPlots.find(p => p.id === id);
                    if (plot) {
                        const r = parseFloat(plot.data.radius.toString().replace(',', '.'));
                        if (!isNaN(r) && r > 0) totalSampleArea += Math.PI * Math.pow(r, 2);
                        
                        totalPlots += (plot.data.antalFlader || 1);

                        if (!firstAreal && plot.data.areal) firstAreal = plot.data.areal;
                        if (!firstSkov && plot.data.saveSkov) firstSkov = plot.data.saveSkov;
                        if (!firstAfd && plot.data.saveAfdeling) firstAfd = plot.data.saveAfdeling;
                        if (!firstLitra && plot.data.saveLitra) firstLitra = plot.data.saveLitra;
                        if (!firstAar && plot.data.saveAarstal) firstAar = plot.data.saveAarstal;

                        plot.data.trees.forEach(t => {
                            combinedTrees.push({
                                ...t, id: Date.now() + Math.random(), 
                                artIndeks: t.artIndeks !== undefined ? t.artIndeks : plot.data.valgtTræIndeks
                            });
                        });
                    }
                });

                // Den matematiske radius for det samlede areal (gemmes i feltet for korrekt Hektar-udregning)
                setRadius(formatDK(totalSampleArea > 0 ? Math.sqrt(totalSampleArea / Math.PI) : 0, 2));
                setAntalFlader(totalPlots);
                setAreal(firstAreal); setSaveSkov(firstSkov); setSaveAfdeling(firstAfd); setSaveLitra(firstLitra); setSaveAarstal(firstAar);
                setTrees(combinedTrees); closeLoadModal();
            };

            const closeLoadModal = () => { setIsLoadModalOpen(false); setMergeMode(false); setSelectedForMerge([]); };

            // --- HOVEDBEREGNINGER ---
            const [resultater, setResultater] = useState({
                stamtalPrHa: 0, G_ha: 0, Dg: 0, HD_forhold: 0, volumenHa: 0, volumenTotal: 0, gnsFormtal: 0, Hg: 0, v_g: 0, speciesStats: []
            });

            useEffect(() => {
                const N_plot = trees.length;
                const radNum = parseFloat(radius.toString().replace(',', '.'));
                const arealNum = parseFloat(areal.toString().replace(',', '.')) || 0;
                
                if (N_plot === 0 || !radNum || radNum <= 0) {
                    setResultater({ stamtalPrHa: 0, G_ha: 0, Dg: 0, HD_forhold: 0, volumenHa: 0, volumenTotal: 0, gnsFormtal: 0, Hg: 0, v_g: 0, speciesStats: [] });
                    return;
                }

                const prøveArealM2 = Math.PI * Math.pow(radNum, 2);
                const opgangningsFaktor = 10000 / prøveArealM2;
                
                let g_sum = 0; let v_sum = 0; let hd_sum = 0; let gh_sum = 0;
                let artVolumen = {};

                trees.forEach(tree => {
                    const radiusM = (tree.d / 100) / 2;
                    const g_i = Math.PI * Math.pow(radiusM, 2);
                    const artIdx = tree.artIndeks !== undefined ? tree.artIndeks : valgtTræIndeks;
                    const nuværendeArt = TRAEARTER[artIdx];
                    const gridData = FORMTAL_GRIDS[nuværendeArt.navn];

                    let f_i = nuværendeArt.standardFormtal;
                    if (gridData) f_i = beregnFormtalFraGrid(tree.d, tree.h, gridData);

                    const v_i = g_i * tree.h * f_i;
                    g_sum += g_i; v_sum += v_i; hd_sum += ((tree.h * 100) / tree.d); gh_sum += (g_i * tree.h);

                    if (!artVolumen[nuværendeArt.navn]) artVolumen[nuværendeArt.navn] = 0;
                    artVolumen[nuværendeArt.navn] += v_i;
                });

                const G_ha = g_sum * opgangningsFaktor;
                const V_ha = v_sum * opgangningsFaktor;
                const Dg = Math.sqrt((g_sum / N_plot) / Math.PI) * 2 * 100; 

                const speciesStats = Object.keys(artVolumen).map(navn => ({
                    art: navn, v_ha: artVolumen[navn] * opgangningsFaktor, pct: v_sum > 0 ? (artVolumen[navn] / v_sum) * 100 : 0
                })).sort((a, b) => b.pct - a.pct);

                setResultater({
                    stamtalPrHa: N_plot * opgangningsFaktor, G_ha, Dg, HD_forhold: hd_sum / N_plot,
                    volumenHa: V_ha, volumenTotal: V_ha * arealNum,
                    gnsFormtal: v_sum / (g_sum * (trees.reduce((acc, t) => acc + t.h, 0) / N_plot)) || 0,
                    Hg: g_sum > 0 ? gh_sum / g_sum : 0, v_g: v_sum / N_plot, speciesStats
                });
            }, [trees, radius, valgtTræIndeks, areal]);

            // --- EKSPORTFUNKTIONER ---
            const genererResumeTekst = () => {
                const navneArr = resultater.speciesStats.map(s => s.art);
                const hovedNavn = navneArr.length > 1 ? 'Blandingsskov' : (navneArr[0] || TRAEARTER[valgtTræIndeks].navn);
                const alder = saveAarstal ? `${new Date().getFullYear() - parseInt(saveAarstal)} år` : 'Ikke oplyst';
                const radNum = parseFloat(radius.toString().replace(',', '.'));
                const gnsRadius = radNum > 0 ? Math.sqrt(Math.pow(radNum, 2) / antalFlader) : 0;
                
                let t = `SKOVTAKSATION: ${hovedNavn}\n`;
                if(saveSkov || saveAfdeling) t += `Skov: ${saveSkov || '-'} | Afd: ${saveAfdeling || '-'} | Litra: ${saveLitra || '-'} | Alder: ${alder}\n`;
                t += `Areal: ${formatDK(areal)} ha  |  Gns. prøveflade r=${formatDK(gnsRadius, 1)}m (${antalFlader} flader)\n`;
                t += `--------------------------------\nNØGLETAL\n• Målte træer:    ${trees.length} stk\n• Stamtal:        ${Math.round(resultater.stamtalPrHa)} stk/ha\n• Grundflade (G): ${formatDK(resultater.G_ha, 1)} m²/ha\n• Dg / Hg:        ${formatDK(resultater.Dg, 1)} cm / ${formatDK(resultater.Hg, 1)} m\n• Middeltræ (Vg): ${formatDK(resultater.v_g, 3)} m³\n• H/D forhold:    ${formatDK(resultater.HD_forhold, 1)}\n--------------------------------\nVEDMASSE\n• Pr. hektar:     ${formatDK(resultater.volumenHa, 1)} m³/ha\n• Total volumen:  ${formatDK(resultater.volumenTotal, 1)} m³\n`;
                if (resultater.speciesStats && resultater.speciesStats.length > 1) {
                    t += `--------------------------------\nARTFORDELING\n`;
                    resultater.speciesStats.forEach(s => t += `• ${s.art}: ${formatDK(s.pct, 1)} % (${formatDK(s.v_ha, 1)} m³/ha)\n`);
                }
                return t;
            };

            const downloadCSV = () => {
                try {
                    // Direktiv til Excel/OneDrive + UTF-8 BOM
                    let csv = "sep=;\n\uFEFF"; 
                    const navneArr = resultater.speciesStats.map(s => s.art);
                    const hovedNavn = navneArr.length > 1 ? 'Blandingsskov' : (navneArr[0] || TRAEARTER[valgtTræIndeks].navn);
                    const alder = saveAarstal ? `${new Date().getFullYear() - parseInt(saveAarstal)} år` : 'Ikke oplyst';
                    
                    const radStr = radius ? radius.toString().replace(',', '.') : '0';
                    const radNum = parseFloat(radStr) || 0;
                    const gnsRadius = (radNum > 0 && antalFlader > 0) ? Math.sqrt(Math.pow(radNum, 2) / antalFlader) : 0;

                    csv += "STAMDATA & METADATA\n";
                    csv += `Skov / Ejendom;${saveSkov || 'Ikke oplyst'}\n`;
                    csv += `Afdeling;${saveAfdeling || 'Ikke oplyst'}\n`;
                    csv += `Litra;${saveLitra || 'Ikke oplyst'}\n`;
                    csv += `Plantningsår;${saveAarstal || 'Ikke oplyst'}\n`;
                    csv += `Bevoksningens alder;${alder}\n`;
                    csv += `Skovtype / Hovedart;${hovedNavn}\n`;
                    csv += `Gennemsnitlig radius på prøveflade(r) (m);${formatDK(gnsRadius, 2)}\n`;
                    csv += `Antal prøveflader i beregningen;${antalFlader}\n`;
                    csv += `Totalt areal (ha);${formatDK(areal)}\n\n`;
                    
                    csv += "BEREGNEDE NØGLETAL (HA-NIVEAU)\n";
                    csv += `Antal opmålte træer;${trees.length} stk\n`;
                    csv += `Stamtal (N);${Math.round(resultater.stamtalPrHa || 0)} stk/ha\n`;
                    csv += `Grundflade (G);${formatDK(resultater.G_ha, 2)} m²/ha\n`;
                    csv += `Grundflade middeldiameter (Dg);${formatDK(resultater.Dg, 2)} cm\n`;
                    csv += `Grundflade middelhøjde (Hg);${formatDK(resultater.Hg, 2)} m\n`;
                    csv += `Middeltræ volumen (Vg);${formatDK(resultater.v_g, 3)} m³\n`;
                    csv += `Gennemsnitligt H/D forhold;${formatDK(resultater.HD_forhold, 1)}\n`;
                    csv += `Gennemsnitligt formtal;${formatDK(resultater.gnsFormtal, 3)}\n`;
                    csv += `Volumen pr. hektar;${formatDK(resultater.volumenHa, 2)} m³/ha\n`;
                    csv += `Total volumen for hele arealet;${formatDK(resultater.volumenTotal, 2)} m³\n\n`;
                    
                    if (resultater.speciesStats && resultater.speciesStats.length > 1) {
                        csv += "ARTFORDELING (VEDMASSE)\n";
                        csv += "Træart;Andel (%);Volumen (m³/ha)\n";
                        resultater.speciesStats.forEach(s => csv += `${s.art};${formatDK(s.pct, 2)};${formatDK(s.v_ha, 2)}\n`);
                        csv += "\n";
                    }
                    
                    csv += "MÅLTE ENKELTTRÆER (RÅDATA TIL ANALYSE)\n";
                    csv += "Træ nr.;Træart;Diameter d (cm);Højde h (m);Formtal f (interpoleret);Volumen v (m³);H/D forhold\n";
                    
                    [...trees].reverse().forEach((t, index) => {
                        const artIdx = t.artIndeks !== undefined ? t.artIndeks : valgtTræIndeks;
                        const nuværendeArt = TRAEARTER[artIdx];
                        const gridData = FORMTAL_GRIDS[nuværendeArt.navn];
                        
                        let f_i = nuværendeArt.standardFormtal;
                        if (gridData) f_i = beregnFormtalFraGrid(t.d, t.h, gridData);
                        
                        const v_i = Math.PI * Math.pow((t.d / 100) / 2, 2) * t.h * f_i;
                        const hd_forhold = t.d > 0 ? (t.h * 100) / t.d : 0;
                        
                        csv += `${trees.length - index};${nuværendeArt.navn};${formatDK(t.d, 1)};${formatDK(t.h, 1)};${formatDK(f_i, 4)};${formatDK(v_i, 4)};${formatDK(hd_forhold, 1)}\n`;
                    });

                    const safeSkovNavn = (saveSkov || 'data').toString().replace(/[^a-z0-9æøå]/gi, '_').toLowerCase();
                    const filename = `taksation_${safeSkovNavn}_${new Date().toISOString().split('T')[0]}.csv`;
                    
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", filename);
                    link.style.display = 'none';
                    
                    document.body.appendChild(link); 
                    link.click(); 
                    
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }, 100);

                } catch (error) {
                    console.error("Fejl ved CSV-generering:", error);
                    alert("Der opstod en fejl ved generering af filen. Prøv venligst igen.");
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center relative">
                    <div className="w-full max-w-4xl bg-white rounded-xl shadow-xl overflow-hidden border border-stone-200">
                        {/* Header */}
                        <div className="bg-green-800 p-6 text-white flex items-center justify-between">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center gap-2">
                                    <TreePine className="w-8 h-8" />
                                    Vedmasseberegner
                                </h1>
                                <p className="text-green-100 text-sm mt-1">Professionel prøvefladetaksation</p>
                            </div>
                            <Calculator className="w-8 h-8 opacity-50 hidden sm:block" />
                        </div>

                        <div className="p-6 grid lg:grid-cols-2 gap-8">
                            
                            {/* VENSTRE KOLONNE */}
                            <div className="space-y-8">
                                
                                {/* Sektion 1: Område & Bestand (Udvidet med stamdata direkte på forsiden) */}
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold border-b pb-2 border-stone-200 flex items-center gap-2 text-green-900">
                                        <CircleDashed className="w-5 h-5" />
                                        Område & Stamdata
                                    </h2>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="flex flex-col col-span-2 sm:col-span-1">
                                            <label className="text-xs font-bold uppercase text-green-800 mb-1">Prøveflade Radius (m)</label>
                                            <input type="number" step="0.1" value={radius} onChange={(e) => setRadius(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none" placeholder="F.eks. 15" />
                                        </div>
                                        <div className="flex flex-col col-span-2 sm:col-span-1">
                                            <label className="text-xs font-bold uppercase text-green-800 mb-1">Totalt Areal (ha)</label>
                                            <input type="number" step="0.1" value={areal} onChange={(e) => setAreal(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none" placeholder="F.eks. 1.5" />
                                        </div>
                                        <div className="flex flex-col col-span-2 sm:col-span-1">
                                            <label className="text-xs font-bold uppercase text-stone-600 mb-1">Skov / Ejendom</label>
                                            <input type="text" value={saveSkov} onChange={(e) => setSaveSkov(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none" placeholder="Navn på skoven" />
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 col-span-2 sm:col-span-1">
                                            <div>
                                                <label className="text-xs font-bold uppercase text-stone-600 mb-1 block text-center">Afd.</label>
                                                <input type="text" value={saveAfdeling} onChange={(e) => setSaveAfdeling(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none w-full text-center" placeholder="Afd" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold uppercase text-stone-600 mb-1 block text-center">Litra</label>
                                                <input type="text" value={saveLitra} onChange={(e) => setSaveLitra(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none w-full text-center" placeholder="Litr" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold uppercase text-stone-600 mb-1 block text-center">Plantet</label>
                                                <input type="number" value={saveAarstal} onChange={(e) => setSaveAarstal(e.target.value)} className="p-2 border border-stone-300 rounded focus:ring-2 focus:ring-green-500 bg-stone-50 outline-none w-full text-center" placeholder="År" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Sektion 2: Træliste */}
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold flex items-center gap-2 text-stone-800 border-b pb-2">
                                        <ListTree className="w-5 h-5 text-green-700" />
                                        Målte Træer ({trees.length})
                                    </h2>

                                    <form onSubmit={tilfoejTrae} className="flex flex-col gap-2 bg-green-50 p-3 rounded-lg border border-green-200 shadow-sm">
                                        <div className="flex flex-col">
                                            <label className="text-xs font-bold text-green-900 mb-1 block">Træart</label>
                                            <select value={valgtTræIndeks} onChange={(e) => setValgtTræIndeks(Number(e.target.value))} className="p-2 border border-green-300 rounded bg-white focus:ring-2 focus:ring-green-500 outline-none w-full">
                                                {TRAEARTER.map((træ, idx) => <option key={idx} value={idx}>{træ.navn}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex gap-2 items-end mt-1">
                                            <div className="flex-1 flex gap-1">
                                                <div className="w-1/2">
                                                    <label className="text-xs font-bold text-green-900 mb-1 block">d1 (cm)</label>
                                                    <input ref={dInputRef} type="number" step="0.1" value={nyDiameter1} onChange={(e) => setNyDiameter1(e.target.value)} placeholder="d1" className="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 outline-none" />
                                                </div>
                                                <div className="w-1/2">
                                                    <label className="text-xs font-bold text-green-900 mb-1 block">d2 (cm)</label>
                                                    <input type="number" step="0.1" value={nyDiameter2} onChange={(e) => setNyDiameter2(e.target.value)} placeholder="d2" className="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 outline-none" />
                                                </div>
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-green-900 mb-1 block">højde (m)</label>
                                                <input type="number" step="0.1" value={nyHoejde} onChange={(e) => setNyHoejde(e.target.value)} placeholder="h" className="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 outline-none" />
                                            </div>
                                            <button type="submit" disabled={(!nyDiameter1 && !nyDiameter2) || !nyHoejde} className="bg-green-700 text-white p-2 rounded hover:bg-green-800 disabled:opacity-50 transition-colors h-[42px] px-4 flex items-center gap-1">
                                                <Plus className="w-4 h-4" /> <span className="hidden sm:inline">Tilføj</span>
                                            </button>
                                        </div>
                                    </form>

                                    <div className="bg-stone-50 border rounded-lg max-h-64 overflow-y-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-stone-200 sticky top-0">
                                                <tr>
                                                    <th className="p-2 font-medium text-stone-600">#</th>
                                                    <th className="p-2 font-medium text-stone-600">Art</th>
                                                    <th className="p-2 font-medium text-stone-600">Diameter</th>
                                                    <th className="p-2 font-medium text-stone-600">Højde</th>
                                                    <th className="p-2 font-medium text-stone-600 text-right">Slet</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {trees.length === 0 ? (
                                                    <tr><td colSpan="5" className="text-center p-4 text-stone-400 italic">Begynd at indtaste træer.</td></tr>
                                                ) : (
                                                    [...trees].reverse().map((t, index) => {
                                                        const artIdx = t.artIndeks !== undefined ? t.artIndeks : valgtTræIndeks;
                                                        return (
                                                            <tr key={t.id} className="border-b border-stone-100 last:border-0 hover:bg-white">
                                                                <td className="p-2 text-stone-400">{trees.length - index}</td>
                                                                <td className="p-2 text-stone-600 text-xs font-semibold">{TRAEARTER[artIdx].navn}</td>
                                                                <td className="p-2 font-semibold">{formatDK(t.d)} cm</td>
                                                                <td className="p-2 text-stone-600">{formatDK(t.h)} m</td>
                                                                <td className="p-2 text-right">
                                                                    <button onClick={() => sletTrae(t.id)} className="text-red-400 hover:text-red-600 p-1 rounded inline-flex justify-center w-full">
                                                                        <Trash2 className="w-4 h-4" />
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            {/* HØJRE KOLONNE: RESULTATER */}
                            <div className="bg-stone-800 text-stone-100 rounded-xl p-6 shadow-xl h-fit sticky top-8 border border-stone-600">
                                <h2 className="text-xl font-bold mb-6 flex items-center gap-2 text-green-400 border-b border-stone-600 pb-3">
                                    <Activity className="w-6 h-6" />
                                    Bestandsdata & Vedmasse
                                </h2>
                                
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4 bg-stone-700/50 p-4 rounded-lg">
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">Grundflade.Mid.Dia (Dg)</p>
                                            <p className="text-2xl font-bold text-white">{formatDK(resultater.Dg, 1)} <span className="text-sm font-normal text-stone-400">cm</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">Grundflade.Mid.Høj (Hg)</p>
                                            <p className="text-2xl font-bold text-white">{formatDK(resultater.Hg, 1)} <span className="text-sm font-normal text-stone-400">m</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">Grundflade (G)</p>
                                            <p className="text-2xl font-bold text-white">{formatDK(resultater.G_ha, 1)} <span className="text-sm font-normal text-stone-400">m²/ha</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">Stamtal (N)</p>
                                            <p className="text-2xl font-bold text-white">{Math.round(resultater.stamtalPrHa)} <span className="text-sm font-normal text-stone-400">stk/ha</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">Middeltræ (Vg)</p>
                                            <p className="text-2xl font-bold text-white">{formatDK(resultater.v_g, 3)} <span className="text-sm font-normal text-stone-400">m³</span></p>
                                        </div>
                                        <div>
                                            <p className="text-stone-400 text-xs uppercase mb-1">H/D Forhold</p>
                                            <p className={`text-2xl font-bold ${resultater.HD_forhold > 80 ? 'text-orange-400' : 'text-green-300'}`}>{formatDK(resultater.HD_forhold, 1)}</p>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-center text-sm bg-stone-900/50 p-3 rounded">
                                        <span className="text-stone-400">Gns. formtal (f):</span>
                                        <span className="font-mono text-yellow-400">{formatDK(resultater.gnsFormtal, 3)}</span>
                                    </div>

                                    <div className="h-px bg-stone-600 w-full"></div>

                                    <div className="flex flex-col gap-4">
                                        <div className="text-center">
                                            <p className="text-stone-400 text-sm uppercase mb-1">Volumen pr. Hektar</p>
                                            <p className="text-4xl font-black text-white">{formatDK(resultater.volumenHa, 1)} m³</p>
                                        </div>
                                        <div className="text-center bg-green-900/40 border border-green-800/50 p-4 rounded-xl mt-2">
                                            <p className="text-green-300/80 text-xs uppercase mb-1">Total Volumen ({formatDK(areal)} ha)</p>
                                            <p className="text-5xl font-black text-green-400 drop-shadow-md">{formatDK(resultater.volumenTotal, 1)} m³</p>
                                        </div>
                                    </div>

                                    {/* Blandingsfordeling */}
                                    {resultater.speciesStats && resultater.speciesStats.length > 1 && (
                                        <div className="mt-4 bg-stone-700/40 p-4 rounded-lg border border-stone-600">
                                            <h3 className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-3">Blandingsfordeling (Vedmasse)</h3>
                                            <div className="space-y-2">
                                                {resultater.speciesStats.map(stat => (
                                                    <div key={stat.art} className="flex justify-between items-center text-sm">
                                                        <span className="text-stone-300 font-medium">{stat.art}</span>
                                                        <div className="flex gap-3 items-center">
                                                            <span className="text-yellow-400 font-mono w-14 text-right">{formatDK(stat.pct, 1)} %</span>
                                                            <span className="text-white w-20 text-right">{formatDK(stat.v_ha, 1)} m³/ha</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Knapper og Styring */}
                                    <div className="pt-4 border-t border-stone-600 mt-6 space-y-3">
                                        <div className="flex gap-2">
                                            <button onClick={() => setIsSaveModalOpen(true)} className="flex-1 bg-stone-700 hover:bg-stone-600 text-white p-2 rounded-lg flex items-center justify-center gap-2 text-sm border border-stone-500">
                                                <Save className="w-4 h-4 text-green-400" /> Gem flade
                                            </button>
                                            <button onClick={() => setIsLoadModalOpen(true)} className="flex-1 bg-stone-700 hover:bg-stone-600 text-white p-2 rounded-lg flex items-center justify-center gap-2 text-sm border border-stone-500">
                                                <FolderOpen className="w-4 h-4 text-yellow-400" /> Åbn gemte
                                            </button>
                                        </div>

                                        <div className="flex gap-2">
                                            <button onClick={() => { const text = genererResumeTekst(); const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); setKopieret(true); setTimeout(() => setKopieret(false), 2000); }} className="flex-1 bg-stone-800 hover:bg-stone-700 text-white p-2 rounded-lg flex items-center justify-center gap-2 text-sm border border-stone-700">
                                                {kopieret ? <Check className="w-4 h-4 text-green-400" /> : <Copy className="w-4 h-4" />}
                                            </button>
                                            <button onClick={async () => { const text = genererResumeTekst(); if (navigator.share) { try { await navigator.share({ title: 'Taksationsresultat', text }); } catch (e) {} } else { dInputRef.current?.focus(); } }} className="flex-1 bg-stone-800 hover:bg-stone-700 text-white p-2 rounded-lg flex items-center justify-center gap-2 text-sm border border-stone-700">
                                                <Share2 className="w-4 h-4" /> 
                                            </button>
                                            <button onClick={downloadCSV} className="flex-1 bg-stone-800 hover:bg-stone-700 text-white p-2 rounded-lg flex items-center justify-center gap-2 text-sm border border-stone-700" title="Download optimeret CSV til Excel/OneDrive">
                                                <Download className="w-4 h-4 text-green-400" /> <span className="font-bold text-xs uppercase text-green-400">Excel</span>
                                            </button>
                                        </div>

                                        <div className="flex gap-2">
                                            {visRydBekræft ? (
                                                <div className="flex-1 flex gap-1">
                                                    <button onClick={rydAlt} className="flex-1 bg-red-600 hover:bg-red-500 text-white p-2 rounded-lg text-sm font-bold">Slet alt!</button>
                                                    <button onClick={() => setVisRydBekræft(false)} className="flex-1 bg-stone-600 hover:bg-stone-500 text-white p-2 rounded-lg text-sm">Fortryd</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setVisRydBekræft(true)} className="flex-1 bg-stone-800 hover:bg-red-900/50 text-red-400 border border-stone-700 p-2 rounded-lg flex items-center justify-center gap-2 text-sm">
                                                    <RefreshCw className="w-4 h-4" /> Nulstil nuværende
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MODAL: Gem Prøveflade */}
                    {isSaveModalOpen && (
                        <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="text-lg font-bold text-green-900 flex items-center gap-2"><Save className="w-5 h-5" /> Gem prøveflade</h3>
                                    <button onClick={() => setIsSaveModalOpen(false)} className="text-stone-400 hover:text-stone-700"><XIcon className="w-5 h-5" /></button>
                                </div>
                                <div className="flex gap-2 mb-4 bg-stone-100 p-1 rounded-lg">
                                    <button className={`flex-1 p-2 rounded-md text-sm ${saveMode === 'structured' ? 'bg-white shadow font-bold text-green-800' : 'text-stone-500'}`} onClick={() => setSaveMode('structured')}>Autonavn (fra forsiden)</button>
                                    <button className={`flex-1 p-2 rounded-md text-sm ${saveMode === 'custom' ? 'bg-white shadow font-bold text-green-800' : 'text-stone-500'}`} onClick={() => setSaveMode('custom')}>Vilkårligt navn</button>
                                </div>
                                {saveMode === 'structured' ? (
                                    <p className="text-xs text-stone-600 mb-6 bg-stone-50 p-3 rounded border">
                                        Genererer automatisk navnet baseret på din forside-indtastning: <br/>
                                        <span className="font-bold text-green-800">
                                            {TRAEARTER[valgtTræIndeks].navn} {saveSkov ? `, ${saveSkov}` : ''} {saveAfdeling ? `, afd. ${saveAfdeling}` : ''}
                                        </span>
                                    </p>
                                ) : (
                                    <div className="flex flex-col mb-6">
                                        <label className="text-xs font-bold uppercase text-stone-600 mb-1">Eget navn på prøveflade</label>
                                        <input type="text" value={saveCustomName} onChange={(e) => setSaveCustomName(e.target.value)} placeholder="Skriv et navn..." className="p-2 border rounded bg-stone-50 outline-none focus:ring-2 focus:ring-green-500" />
                                    </div>
                                )}
                                <button onClick={handleSavePlot} className="w-full bg-green-700 hover:bg-green-600 text-white font-bold p-3 rounded-lg flex justify-center items-center gap-2">Gem nu</button>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Åbn Gemte */}
                    {isLoadModalOpen && (
                        <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center mb-2 border-b pb-2">
                                    <h3 className="text-lg font-bold text-green-900 flex items-center gap-2"><FolderOpen className="w-5 h-5" /> Åbn gemte</h3>
                                    <button onClick={closeLoadModal} className="text-stone-400 hover:text-stone-700"><XIcon className="w-5 h-5" /></button>
                                </div>
                                {savedPlots.length > 0 && (
                                    <div className="flex justify-between items-center mb-4 bg-stone-50 p-2 rounded-lg border">
                                        <button onClick={() => { setMergeMode(!mergeMode); setSelectedForMerge([]); }} className={`text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1 ${mergeMode ? 'bg-stone-700 text-white' : 'bg-green-100 text-green-800 hover:bg-green-200'}`}>
                                            <Layers className="w-3 h-3" /> {mergeMode ? 'Afbryd sammenlægning' : 'Sammenlæg flere flader'}
                                        </button>
                                    </div>
                                )}
                                <div className="overflow-y-auto space-y-2 mb-4 flex-1">
                                    {savedPlots.length === 0 ? (
                                        <p className="text-center p-4 text-stone-500 italic">Ingen gemte prøveflader endnu.</p>
                                    ) : (
                                        savedPlots.slice().reverse().map(plot => {
                                            const isSelected = selectedForMerge.includes(plot.id);
                                            return (
                                                <div key={plot.id} onClick={() => mergeMode && toggleMergeSelection(plot.id)} className={`border p-3 rounded-lg flex flex-col gap-2 cursor-pointer ${mergeMode && isSelected ? 'border-green-500 bg-green-50' : 'hover:bg-stone-50'}`}>
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <p className="font-semibold text-stone-800 text-sm leading-tight">{plot.name}</p>
                                                            <p className="text-xs text-stone-500 mt-1">Dato: {plot.date} • {plot.data.trees.length} træer</p>
                                                        </div>
                                                        {mergeMode && <input type="checkbox" checked={isSelected} readOnly className="w-4 h-4 text-green-600 mt-1 pointer-events-none" />}
                                                    </div>
                                                    {!mergeMode && (
                                                        <div className="flex gap-2 mt-1">
                                                            <button onClick={(e) => { e.stopPropagation(); loadPlot(plot); }} className="flex-1 bg-green-100 text-green-800 text-xs font-bold p-2 rounded">Åbn</button>
                                                            <button onClick={(e) => { e.stopPropagation(); deletePlot(plot.id); }} className="bg-red-50 text-red-600 p-2 rounded"><Trash2 className="w-4 h-4" /></button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                                {mergeMode ? (
                                    <button onClick={executeMerge} disabled={selectedForMerge.length < 2} className={`w-full font-bold p-3 rounded-lg flex justify-center items-center gap-2 ${selectedForMerge.length >= 2 ? 'bg-green-700 text-white' : 'bg-stone-200 text-stone-400'}`}>
                                        <Layers className="w-5 h-5" /> Sammenlæg ({selectedForMerge.length} valgt)
                                    </button>
                                ) : (
                                    <button onClick={closeLoadModal} className="w-full bg-stone-200 text-stone-800 font-bold p-3 rounded-lg">Luk</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SkovBeregner />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(() => console.log('Offline klar!')).catch(e => console.log(e));
            });
        }
    </script>
</body>
</html>
